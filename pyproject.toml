[project]
name = "mac-bridge"
version = "0.5.0b10"
description = "Private MCP desktop bridge for macOS/Windows development, Chrome, screenshots and video frames"
requires-python = ">=3.11"
dependencies = [
  "mcp==1.28.0",
  "yt-dlp[default]>=2025.11.12",
  "Pillow>=11,<13",
  "keyring>=25,<26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mac_bridge", "scene_bridge"]
