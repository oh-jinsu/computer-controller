[project]
name = "mac-bridge"
version = "0.5.0b18"
description = "Cross-platform MCP computer controller for macOS, Windows and Linux/EC2"
requires-python = ">=3.11"
dependencies = [
  "mcp==2.2.0",
  "yt-dlp[default]>=2025.11.12",
  "Pillow>=11,<13",
  "keyring>=25,<26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mac_bridge", "scene_bridge"]
