name: Computer Controller tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -e .
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm ci --ignore-scripts --no-audit --no-fund
      - name: npm CLI package checks
        run: |
          npm test
          node npm/cli.mjs --help
          npm pack --dry-run
      - name: Linux npm install, setup, doctor and MCP catalog smoke
        run: node npm/tests/linux-package-smoke.mjs
      - name: Unit tests (includes real FFmpeg; native macOS mocked)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Syntax
        run: |
          python -m compileall -q mac_bridge scene_bridge tests run_server.py
          bash -n Mac-Start.command Mac-Stop.command Mac-Screen-Permission.command Mac-Release.command
          node --check mac_bridge/dc_entry.mjs
          node --check npm/cli.mjs
      - name: Install isolated pinned local engine
        run: python -c 'from pathlib import Path; from mac_bridge.setup import ensure_engine; ensure_engine(Path.cwd())'
      - name: Real MCP SDK and engine (disposable files; no native UI or tunnel)
        run: python tests/smoke_mac_mcp.py
      - name: Real MCP and video frames (no YouTube or tunnel)
        run: python tests/smoke_mcp.py
      - name: Persistent always-allow mode through real MCP (disposable files only)
        run: python tests/smoke_approval_mcp.py

      - name: Request logging through real stdio (disposable data; no tunnel)
        run: python tests/smoke_request_logging.py
